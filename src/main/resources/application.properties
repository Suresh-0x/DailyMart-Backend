# ============================================================
# DailyMart – Application Configuration
# ============================================================
spring.application.name=dailymart-backend
server.port=8080
server.servlet.context-path=/api

# ── MySQL ───────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/dailymart_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=suresh@2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ── JWT ─────────────────────────────────────────────────────
app.jwt.secret=ZGFpbHltYXJ0LXN1cGVyLXNlY3JldC1qd3Qta2V5LTIwMjQtc2hvdWxkLWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmc=
app.jwt.access-token-expiry=86400000
app.jwt.refresh-token-expiry=604800000

# ── Email (Gmail SMTP) ───────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL@gmail.com
spring.mail.password=YOUR_16_CHAR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=noreply@dailymart.com
app.frontend.url=http://localhost:3000

# ── File Upload ──────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# ── Cloudinary ───────────────────────────────────────────────
cloudinary.cloud-name=YOUR_CLOUD_NAME
cloudinary.api-key=YOUR_API_KEY
cloudinary.api-secret=YOUR_API_SECRET

# ── Razorpay ─────────────────────────────────────────────────
razorpay.key-id=rzp_test_YOUR_KEY_ID
razorpay.key-secret=YOUR_KEY_SECRET
razorpay.currency=INR

# ── Cache ────────────────────────────────────────────────────
spring.cache.type=simple

# ── Swagger ──────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ──────────────────────────────────────────────────
logging.level.com.dailymart=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
