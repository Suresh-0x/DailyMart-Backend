# Test Application Configuration (H2 In-Memory)
spring.application.name=dailymart-backend-test

# ── H2 In-Memory Database ─────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:dailymart_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── JWT ───────────────────────────────────────────────────────
app.jwt.secret=ZGFpbHltYXJ0LXN1cGVyLXNlY3JldC1qd3Qta2V5LTIwMjQtc2hvdWxkLWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmc=
app.jwt.access-token-expiry=86400000
app.jwt.refresh-token-expiry=604800000

# ── App Properties ────────────────────────────────────────────
spring.mail.host=localhost
spring.mail.port=25
app.mail.from=noreply@dailymart.com
app.frontend.url=http://localhost:3000

# ── Cloudinary Mock ───────────────────────────────────────────
